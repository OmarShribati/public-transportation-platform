<svg 
    viewBox="0 0 200 160" 
    fill="none" 
    xmlns="http://www.w3.org/2000/svg"
    strokeLinecap="round" 
    strokeLinejoin="round"
    aria-labelledby="logoTitle"
    role="img"
    className="drop-shadow-[0_0_12px_rgba(16,185,129,0.4)]"
>
    <title id="logoTitle">Emerald Smart Fleet Logo</title>
    
    <defs>
        <linearGradient id="emeraldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stopColor:#10b981;stopOpacity:1" />
            <stop offset="100%" style="stopColor:#059669;stopOpacity:1" />
        </linearGradient>
        
        {/* توهج داخلي إضافي */}
        <filter id="glow">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    {/* المسار الهندسي المطور بلون الزمرد */}
    <path 
        d="M 50 100 
           L 10 60 
           L 10 10 
           L 50 50 
           L 150 50 
           L 190 10 
           L 190 60 
           L 150 100 
           L 100 100 
           L 100 80 
           L 130 80 
           L 160 50 
           L 160 30 
           L 100 30 
           L 100 50 
           L 40 50 
           L 40 80 
           L 70 80 
           L 70 100 Z"
        fill="url(#emeraldGradient)"
        filter="url(#glow)"
    />
    
    {/* النقطة المركزية (النبض الذكي) */}
    <circle 
        cx="100" 
        cy="140" 
        r="10" 
        fill="#10b981" 
    >
        <animate 
            attributeName="opacity" 
            values="1;0.4;1" 
            dur="2s" 
            repeatCount="indefinite" 
        />
        <animate 
            attributeName="r" 
            values="10;12;10" 
            dur="2s" 
            repeatCount="indefinite" 
        />
    </circle>

    {/* لمسة تقنية: خطوط دقيقة تعطي إيحاء بمرور البيانات */}
    <path 
        d="M 60 50 L 140 50" 
        stroke="white" 
        strokeWidth="1" 
        strokeOpacity="0.3" 
    />
</svg>